<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slovo dne – Multiplayer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">slovo<span class="logo-dot">.</span></h1>
      <p class="tagline">Uhádni tajné slovo podle sémantické blízkosti</p>
    </div>
  </header>

  <!-- Notifikace -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- LOBBY -->
  <main id="lobby-section" class="container">
    <div class="card">
      <label class="field-label" for="player-name">Přezdívka</label>
      <input class="input" type="text" id="player-name" placeholder="Jak ti říkají?" maxlength="20" autocomplete="off">
    </div>

    <div class="lobby-actions">
      <div class="card">
        <h2 class="card-title">Nová místnost</h2>
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-create-daily">📅 Dnešní slovo</button>
          <button class="btn btn-secondary" id="btn-create-random">🎲 Náhodné slovo</button>
        </div>
      </div>

      <div class="divider-or"><span>nebo</span></div>

      <div class="card">
        <h2 class="card-title">Připojit se</h2>
        <div class="input-row">
          <input class="input input-code" type="text" id="room-code-input" placeholder="Kód místnosti" maxlength="6" autocomplete="off">
          <button class="btn btn-primary" id="btn-join-room">Vstoupit →</button>
        </div>
      </div>
    </div>
  </main>

  <!-- HRA -->
  <main id="game-section" class="container" style="display:none;">

    <div class="game-header">
      <div class="room-badge">
        <span class="room-badge-label">Místnost</span>
        <span class="room-badge-code" id="display-room-code"></span>
      </div>
      <div class="game-meta">
        <span id="display-mode" class="meta-chip"></span>
        <span id="display-date" class="meta-chip"></span>
      </div>
    </div>

    <div id="hint-bar" class="hint-bar">
      Nápověda: <strong id="display-hint"></strong>
    </div>

    <!-- Tajné slovo (viditelné jen po vyřešení / vzdání) -->
    <div id="secret-word-box" class="secret-box" style="display:none;">
      <span class="secret-label">Tajné slovo:</span>
      <span id="display-secret-word" class="secret-word"></span>
    </div>

    <!-- Hlavní herní plocha -->
    <div class="game-grid">

      <!-- Levý panel: hráči + ovládání -->
      <aside class="side-panel">
        <h3 class="panel-title">Hráči</h3>
        <ul class="players-list" id="players-list"></ul>

        <div id="host-controls" class="host-controls" style="display:none;">
          <button class="btn btn-secondary btn-full" id="btn-next-round">↺ Nové kolo</button>
        </div>
      </aside>

      <!-- Pravý panel: hádání + výsledky -->
      <section class="main-panel">
        <div id="guess-controls" class="guess-bar">
          <input class="input input-guess" type="text" id="guess-input" placeholder="Napiš slovo…" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="btn btn-primary" id="btn-submit-guess">Hádat</button>
          <button class="btn btn-ghost btn-give-up" id="btn-reveal-word">Vzdát se</button>
        </div>
        <p id="guess-feedback" class="guess-feedback"></p>

        <div class="guesses-header">
          <span class="guesses-title">Odhalená slova</span>
          <span class="guesses-count" id="guesses-count">0 tipů</span>
        </div>

        <table class="guesses-table" id="guesses-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Slovo</th>
              <th>Kdo</th>
            </tr>
          </thead>
          <tbody id="guesses-list">
            <tr class="empty-row">
              <td colspan="3">Zatím žádné tipy. Začni hádat!</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
