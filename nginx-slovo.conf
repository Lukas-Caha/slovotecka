# Vzorová konfigurace Nginx reverzní proxy pro hru SLOVO. na Linux VPS
# Umístění: /etc/nginx/sites-available/slovo
# Aktivace: ln -s /etc/nginx/sites-available/slovo /etc/nginx/sites-enabled/
# SSL certifikát získáte příkazem: sudo certbot --nginx -d vase-domena.cz

# Přesměrování HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vase-domena.cz www.vase-domena.cz;

    return 301 https://$host$request_uri;
}

# Produkční HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vase-domena.cz www.vase-domena.cz;

    # Cesty k SSL certifikátům vygenerovaným Certbotem
    ssl_certificate /etc/letsencrypt/live/vase-domena.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vase-domena.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Omezení velikosti nahrávaných dat
    client_max_body_size 5M;

    # Gzip komprese pro bleskové načítání
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Statické soubory s dlouhou mezipamětí (cache)
    location ~* \.(woff2|svg|jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Hlavní aplikace a Socket.IO WebSockety
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Nezbytné hlavičky pro funkční WebSockety (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Předání reálné IP adresy návštěvníka do Expressu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Časové limity pro dlouhotrvající WebSocket spojení
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
